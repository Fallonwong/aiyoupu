<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI有谱 · 方向台</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23101d33'/%3E%3Cpath d='M9 22V10h4v8h10v4z' fill='%23e95514'/%3E%3C/svg%3E">
<script src="/react-bundle.js"></script><script defer src="/app.js"></script>
<style>
[hidden]{display:none!important}
:root{--bg:#f5f6f8;--card:#fff;--ink:#16202f;--ink2:#405066;--muted:#728095;--line:#e2e7ee;--orange:#e95514;--navy:#101d33;--green:#16805a;--navy-soft:#fff4ef}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--ink);font:13px/1.5 Inter,system-ui,"Microsoft YaHei",sans-serif;overflow:hidden}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}button:disabled{opacity:.45;cursor:not-allowed}
#app{height:100dvh;display:flex;flex-direction:column;padding:12px 15px 15px;gap:10px;min-height:0}
header{display:flex;align-items:center;gap:10px;flex-shrink:0;height:36px}
.brand{display:flex;align-items:center;gap:2px;font:700 18px/1 "Space Grotesk",Inter,sans-serif;letter-spacing:-.03em}.brand img{width:122px;height:30px;object-fit:contain;object-position:left center;display:block}.brand span{color:var(--orange)}
.pill{font:600 10px/1 ui-monospace,monospace;letter-spacing:.06em;padding:4px 8px;border-radius:999px;background:var(--navy-soft);color:#b9400e;border:1px solid #ffddcb}
.subtitle-mini{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.grow{flex:1}
#main{display:grid;grid-template-columns:minmax(0,1fr) 286px;gap:11px;min-height:0;flex:1}
#canvasColumn{min-width:0;display:flex;flex-direction:column;gap:9px;min-height:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 5px 18px rgba(16,29,51,.04)}
#presetBar{padding:10px 12px;flex-shrink:0}
.bar-head{display:flex;align-items:center;gap:8px;margin-bottom:9px}.bar-head h2{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0}.bar-head .status{font-size:11.5px;color:var(--ink2);margin-left:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#presets{display:flex;gap:7px;flex-wrap:wrap}.preset{padding:7px 11px;border:1px solid var(--line);border-radius:999px;background:#fbfcfe;font-size:12px;font-weight:600;color:var(--ink2);line-height:1.2;text-align:left}.preset small{display:block;font:500 9px/1.2 ui-monospace,monospace;color:var(--muted);margin-top:2px}.preset.active{border-color:var(--orange);background:var(--orange);color:#fff;box-shadow:0 5px 14px rgba(233,85,20,.22)}.preset.active small{color:#fff9f5}
.preset.unavailable{opacity:.56;cursor:not-allowed}.preset.unavailable:hover{background:#fbfcfe}
#playArea{position:relative;flex:1;min-height:0;border-radius:16px;background:var(--navy);display:flex;align-items:center;justify-content:center;padding:12px;box-shadow:0 10px 28px rgba(16,29,51,.13);overflow:hidden}
#viewport{width:100%;height:100%;display:flex;align-items:center;justify-content:center;min-height:0;background:var(--navy);border-radius:10px}
#playerWrap{position:relative;background:#05070b;border-radius:10px;overflow:hidden;box-shadow:0 15px 42px rgba(0,0,0,.4)}#player{position:absolute;inset:0}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#cad6e8;text-align:center;padding:24px;z-index:2;background:#12213a;border-radius:10px}
#transport{padding:9px 12px;flex-shrink:0;display:flex;align-items:center;gap:9px}.icon-btn{width:35px;height:35px;border-radius:50%;display:grid;place-items:center;background:var(--orange);color:#fff;font-size:13px;box-shadow:0 3px 10px rgba(233,85,20,.2)}.icon-btn.secondary{background:#edf1f6;color:var(--ink2);box-shadow:none}
.track{display:flex;flex-direction:column;min-width:0;flex-shrink:0;max-width:210px}.track b{font-size:12px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.track span{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#seek{flex:1;min-width:50px;accent-color:var(--orange)}.clock{font:600 11px/1 ui-monospace,monospace;white-space:nowrap;color:var(--ink2)}.audioState{font-size:10px;padding:3px 7px;border-radius:999px;background:#f0f3f7;color:var(--muted);white-space:nowrap}.audioState.ok{background:#eaf8f1;color:#146c4f}.audioState.warn{background:#fff4e8;color:#a3580d}
#side{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:9px;padding-right:2px}
.panel{padding:12px}.panel h2{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.row{display:flex;align-items:center;gap:8px;margin:7px 0}.row label{width:96px;flex-shrink:0;color:var(--ink2);font-size:12px}.row select{flex:1;min-width:0;height:31px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:0 7px;font-size:12px}
.rangeRow{display:flex;align-items:center;gap:8px;margin:9px 0}.rangeRow label{width:75px;font-size:11.5px;color:var(--ink2)}.rangeRow input{flex:1;min-width:0;accent-color:var(--orange)}.rangeRow output{min-width:37px;text-align:right;font:600 11px/1 ui-monospace,monospace;color:var(--ink2)}
.hint{font-size:10.5px;line-height:1.6;color:var(--muted);margin-top:8px}.hint.error{color:#b3261e}.hint.ok{color:var(--green)}
details{border-top:1px solid var(--line);margin-top:8px;padding-top:8px}summary{cursor:pointer;font-size:11.5px;color:var(--ink2);font-weight:600;list-style:none}summary::-webkit-details-marker{display:none}summary::after{content:' +';float:right;color:var(--muted)}details[open] summary::after{content:' −'}
#actions{position:sticky;bottom:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px;box-shadow:0 -4px 16px rgba(16,29,51,.04)}
#save{margin-top:4px;width:100%;padding:10px;border-radius:10px;background:var(--navy);color:#fff;font-weight:650;font-size:13px}#save:hover{background:#1b2c48}
#prompt{width:100%;min-height:65px;border:1px solid var(--line);border-radius:7px;background:#fbfcfe;padding:8px;font:11px/1.5 ui-monospace,monospace;resize:vertical;margin-top:7px;color:var(--ink2)}
#copy{width:100%;padding:8px;margin-top:6px;border-radius:8px;background:var(--orange);color:#fff;font-weight:600}
#saveMessage{font-size:10.5px;line-height:1.55;margin-top:7px;color:var(--muted);word-break:break-word}
#notice{position:absolute;inset:0;background:rgba(9,18,33,.74);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}.noticeCard{max-width:430px;background:#fff;border-radius:14px;padding:18px;color:var(--ink);box-shadow:0 15px 40px rgba(0,0,0,.3)}.noticeCard h3{margin:0 0 7px;font-size:15px}.noticeCard p{font-size:12.5px;line-height:1.65;color:var(--ink2);white-space:pre-wrap;margin:0 0 13px}.noticeCard button{padding:7px 15px;border-radius:8px;background:var(--navy);color:#fff;font-weight:600}
@media(max-width:1080px){#main{grid-template-columns:minmax(0,1fr) 266px}.track{max-width:150px}}@media(max-width:820px){#main{grid-template-columns:1fr;overflow:auto}.side{max-height:390px}}
</style></head><body>
<div id="app">
 <header><div class="brand"><img id="brandLogo" src="/brand-logo.png" alt="FallonTalk"><span>AI有谱</span></div><span class="pill">DIRECTION</span><span class="subtitle-mini" id="headerNote">仅调整视觉方向</span><span class="grow"></span><span class="subtitle-mini" id="headerMeta"></span></header>
 <div id="main">
  <main id="canvasColumn">
   <section class="card" id="presetBar"><div class="bar-head"><h2>方向预设</h2><span class="status" id="presetStatus"></span></div><div id="presets"></div></section>
   <section id="playArea"><div id="viewport"><div id="playerWrap"><div id="player"></div><div id="empty"><div><b style="font-size:15px">正在载入预览</b><div style="font-size:11.5px;margin-top:8px;color:#aab9ce">Agent 准备的谱面与试听会直接出现在这里。</div></div></div></div></div><div id="notice" hidden><div class="noticeCard"><h3 id="noticeTitle">预览不可用</h3><p id="noticeText"></p><button id="noticeClose" type="button">知道了</button></div></div></section>
   <section class="card" id="transport"><button class="icon-btn" id="play" type="button" aria-label="播放">▶</button><button class="icon-btn secondary" id="pause" type="button" aria-label="暂停">Ⅱ</button><div class="track"><b id="title">正在载入…</b><span id="meta"></span></div><input id="seek" type="range" min="0" value="0" aria-label="进度"><span class="clock" id="time">00:00</span><span class="clock" id="frame">0</span><span id="audioState" class="audioState">音频：检测中…</span></section>
  </main>
  <aside id="side">
   <section class="panel card"><h2>常用参数</h2>
    <div class="row"><label for="aspectRatio">画幅</label><select id="aspectRatio"><option value="9:16">9:16 竖屏</option><option value="16:9">16:9 横屏</option></select></div>
    <div class="row"><label for="presetSelect">预设</label><select id="presetSelect"></select></div>
    <div class="row"><label for="cameraMode">运镜</label><select id="cameraMode"><option value="portrait-focus">竖屏聚焦</option><option value="portrait-runway">竖屏跑道</option><option value="landscape-classic">横屏跟谱</option></select></div>
    <div class="rangeRow"><label for="titleScale">标题字号</label><input id="titleScale" type="range" min="0.5" max="2" step="0.05"><output id="titleScaleVal"></output></div>
    <div class="hint" id="compatHint"></div>
    <details><summary>高级参数</summary>
     <div class="row"><label for="theme">背景</label><select id="theme"><option value="slate-gray">经典石板灰</option><option value="obsidian-dark">黑曜石暗夜</option><option value="deep-sapphire">普鲁士深蓝</option><option value="pure-white">教学白纸</option></select></div>
     <div class="row"><label for="texture">谱面质感</label><select id="texture"><option value="black-multiply">黑墨印刷</option><option value="metallic-screen">金属反光</option></select></div>
     <div class="row"><label for="typography">标题规则</label><select id="typography"><option value="chinese-2x">中文大标题</option><option value="bodoni-royal">Bodoni 衬线</option><option value="clean">极简</option></select></div>
     <div class="row"><label for="motionFx">动效</label><select id="motionFx"><option value="converge-arc">合流跃动</option><option value="pulse-only">音头脉冲</option></select></div>
     <div class="rangeRow"><label for="scale">缩放</label><input id="scale" type="range" min="0.5" max="5" step="0.05"><output id="scaleVal"></output></div>
     <div class="rangeRow"><label for="rotateX">俯仰</label><input id="rotateX" type="range" min="-80" max="80" step="1"><output id="rotateXVal"></output></div>
     <div class="rangeRow"><label for="rotateZ">旋转</label><input id="rotateZ" type="range" min="-90" max="10" step="1"><output id="rotateZVal"></output></div>
     <div class="rangeRow"><label for="focusX">焦点左右</label><input id="focusX" type="range" min="-120" max="120" step="2"><output id="focusXVal"></output></div>
     <div class="rangeRow"><label for="focusY">焦点上下</label><input id="focusY" type="range" min="-120" max="120" step="2"><output id="focusYVal"></output></div>
    </details>
   </section>
   <section id="actions"><div class="hint" id="saveMessage">选好方向后保存，再把短提示词交回 Agent。保存方向本身不是审批。</div><button id="save" type="button">保存方向并复制</button><textarea id="prompt" readonly hidden></textarea><button id="copy" type="button" hidden>复制提示词</button></section>
  </aside>
 </div>
</div>
</body></html>
